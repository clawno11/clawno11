name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '同日多次发布时追加序号（留空=首次，填2=第二次）'
        required: false
        default: ''
      dry_run:
        description: '仅构建不发布 Release（true=dry run）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      name: ${{ steps.ver.outputs.name }}
    steps:
      - name: Compute CalVer tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATE_TAG="v$(date -u +%y.%-m.%-d)"
            SUFFIX="${{ github.event.inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              DATE_TAG="${DATE_TAG}.${SUFFIX}"
            fi
            echo "tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
            echo "name=ClawNo.11 ${DATE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=ClawNo.11 ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: shiyi yan (R4F6WVNKS8)"
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseName: ${{ needs.resolve-version.outputs.name }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Notarize macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          DMG=$(find target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to notarize"
            exit 1
          fi
          echo "Notarizing $DMG ..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 10m
          echo "Stapling $DMG ..."
          xcrun stapler staple "$DMG"
          echo "Notarization complete."
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
