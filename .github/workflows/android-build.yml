name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install

      - name: Build openclaw-client
        run: pnpm --filter @clawno/openclaw-client build

      - name: Setup Android signing
        if: inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/keystore.jks
            echo "Keystore decoded: $(wc -c < $RUNNER_TEMP/keystore.jks) bytes"
            PROPS_FILE=apps/mobile/src-tauri/gen/android/keystore.properties
            echo "storeFile=$RUNNER_TEMP/keystore.jks" > "$PROPS_FILE"
            echo "storePassword=$ANDROID_STORE_PASSWORD" >> "$PROPS_FILE"
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> "$PROPS_FILE"
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> "$PROPS_FILE"
            echo "Signing keystore configured"
          else
            echo "No keystore secret found — APK will be unsigned (debug mode)"
          fi

      - name: Init Android project
        working-directory: apps/mobile
        run: pnpm tauri android init

      - name: Build Android APK
        working-directory: apps/mobile
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            pnpm tauri android build --debug
          else
            pnpm tauri android build
          fi

      - name: Find APK files
        id: find-apk
        run: |
          echo "=== Searching for APK files ==="
          find apps/mobile/src-tauri/gen/android -name "*.apk" -type f | head -20
          APK_PATH=$(find apps/mobile/src-tauri/gen/android -name "*.apk" -not -path "*/intermediates/*" -type f | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClawNo11-Android-${{ inputs.build_type }}
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Build summary
        run: |
          echo "## Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type:** ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** Available in Artifacts above" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_type }}" = "release" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "- **Signing:** Release signed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Signing:** Unsigned (debug)" >> $GITHUB_STEP_SUMMARY
          fi
