[package]
name = "clawno-mobile"
version = "26.3.22"
description = "ClawNo.11 Mobile — AI Gateway Client"
authors = ["Clawno Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
clawno-core = { path = "../../../crates/clawno-core", features = ["mobile", "ssh-exec"] }
tauri = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-sql = { workspace = true }
tauri-plugin-http = { workspace = true }
tauri-plugin-barcode-scanner = "2"
tauri-plugin-edge-to-edge = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dirs-next = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
async-trait = { workspace = true }
