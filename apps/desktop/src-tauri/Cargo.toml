[package]
name = "clawno-desktop"
version = "26.3.22"
description = "Clawno Desktop - One-click OpenClaw deployment"
authors = ["Clawno Team"]
license = "MIT"
repository = "https://github.com/clawno11/clawno11"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clawno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
clawno-core = { path = "../../../crates/clawno-core", features = ["desktop", "ssh-exec"] }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = "2"
tauri-plugin-store = { workspace = true }
tauri-plugin-sql = { workspace = true }
tauri-plugin-http = { workspace = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dirs-next = { workspace = true }
reqwest = { workspace = true, default-features = true, features = ["json", "stream"] }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
futures-util = { workspace = true }
rand = "0.8"
russh = { workspace = true }
russh-keys = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
sysinfo = "0.33"
axum = { version = "0.8.4", features = ["json"] }
tokio-stream = "0.1"
