[package]
name = "clawno-desktop"
version = "0.1.0"
description = "Clawno Desktop - One-click OpenClaw deployment"
authors = ["Clawno Team"]
license = "MIT"
repository = "https://github.com/clawno11/clawno11"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clawno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs-next = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
rand = "0.8"
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"
axum = { version = "0.8.4", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
