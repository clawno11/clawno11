name = "clawno11-refer"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 生产环境路由 —— clawno11.ai 域名必须已托管到 Cloudflare DNS
[[routes]]
pattern = "refer.clawno11.ai/*"
zone_name = "clawno11.ai"

# 开发测试用变量（真实 ID 请用 wrangler secret put 命令设置，不要写在这里）
[vars]
AFFILIATE_ALIYUN       = ""
AFFILIATE_TENCENT      = ""
AFFILIATE_DIGITALOCEAN = ""
AFFILIATE_VULTR        = ""
AFFILIATE_LINODE       = ""
AFFILIATE_ZHIPU        = ""
FALLBACK_URL           = "https://clawno11.ai"

# ── 部署步骤 ────────────────────────────────────────────────────────────────────
# 前提：clawno11.ai 的 DNS 已托管到 Cloudflare（在 Cloudflare 控制台 Add a Site）
#
# 1. 安装 wrangler:  npm install -g wrangler
# 2. 登录 Cloudflare: wrangler login
# 3. 部署（先不带自定义域名测试）:
#      wrangler deploy
#    部署后会给出 https://clawno11-refer.YOUR_ACCOUNT.workers.dev 可先用此测试
#
# 4. 填入真实推广 ID（加密存储，不进代码库）:
#      wrangler secret put AFFILIATE_ALIYUN       # 输入: 5oxdiqai
#      wrangler secret put AFFILIATE_TENCENT      # 输入: 腾讯云 cps_key 短链 ID
#      wrangler secret put AFFILIATE_DIGITALOCEAN # 输入: 17ba91ff3f80
#      wrangler secret put AFFILIATE_VULTR        # 输入: 9878372
#      wrangler secret put AFFILIATE_LINODE       # 输入: Linode ref（待获取）
#      wrangler secret put AFFILIATE_ZHIPU        # 输入: FM8EPQWWZT
#
# 5. 确认 clawno11.ai DNS 已在 Cloudflare 托管后，自定义域名路由自动生效
#    无需额外操作，refer.clawno11.ai/* 会自动路由到此 Worker
#
# 修改任意 ID：wrangler secret put AFFILIATE_XXX → 输入新值 → 立即生效，无需重新部署
